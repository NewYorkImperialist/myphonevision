; Controller firmware. Two boards are supported; pick the env for yours:
;   ESP32-DevKitC:     pio run -e devkit_left -t upload   (or devkit_right)
;   Xiao ESP32S3:      pio run -e xiao_left -t upload     (or xiao_right)
; UDP fallback (no hub): add _udp, e.g. devkit_left_udp, after setting the
; hotspot SSID/password and the PC's IP in include/config.h.

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200

[devkit]
board = esp32dev
build_flags = -I../shared -DMPV_BOARD_DEVKIT=1

[xiao]
board = seeed_xiao_esp32s3
build_flags = -I../shared -DARDUINO_USB_CDC_ON_BOOT=1

[env:devkit_left]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DMPV_HAND=0

[env:devkit_right]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DMPV_HAND=1

[env:devkit_left_udp]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DMPV_HAND=0 -DMPV_TRANSPORT_UDP=1

[env:devkit_right_udp]
board = ${devkit.board}
build_flags = ${devkit.build_flags} -DMPV_HAND=1 -DMPV_TRANSPORT_UDP=1

[env:xiao_left]
board = ${xiao.board}
build_flags = ${xiao.build_flags} -DMPV_HAND=0

[env:xiao_right]
board = ${xiao.board}
build_flags = ${xiao.build_flags} -DMPV_HAND=1

[env:xiao_left_udp]
board = ${xiao.board}
build_flags = ${xiao.build_flags} -DMPV_HAND=0 -DMPV_TRANSPORT_UDP=1

[env:xiao_right_udp]
board = ${xiao.board}
build_flags = ${xiao.build_flags} -DMPV_HAND=1 -DMPV_TRANSPORT_UDP=1
