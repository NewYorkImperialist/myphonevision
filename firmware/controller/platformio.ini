; Controller firmware for the Seeed Xiao ESP32S3 Sense.
; Build/flash one hand:  pio run -e left -t upload   (or -e right)
; UDP fallback (no hub): pio run -e left_udp -t upload, after setting the
; hotspot SSID/password and the PC's IP in include/config.h.

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:left]
build_flags = ${env.build_flags} -DMPV_HAND=0

[env:right]
build_flags = ${env.build_flags} -DMPV_HAND=1

[env:left_udp]
build_flags = ${env.build_flags} -DMPV_HAND=0 -DMPV_TRANSPORT_UDP=1

[env:right_udp]
build_flags = ${env.build_flags} -DMPV_HAND=1 -DMPV_TRANSPORT_UDP=1
