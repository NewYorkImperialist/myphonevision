; ESP-NOW hub for the ESP32-DevKitC-32UE plugged into the PC.
; It relays controller packets to USB serial and haptic packets back.
; The 32UE has no PCB antenna: fit a 2.4 GHz U.FL antenna or a 31 mm wire.

[env:hub]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -I../shared
