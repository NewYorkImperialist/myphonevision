[project]
name = "myphonevision-bridge"
version = "0.1.0"
description = "Controller packets (ESP-NOW hub or UDP) to Virtual Motion Tracker OSC"
requires-python = ">=3.10"
dependencies = [
  "python-osc>=1.8",
  "pyserial>=3.5",
  "openvr>=1.26; sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
myphonevision-bridge = "myphonevision_bridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["myphonevision_bridge"]
